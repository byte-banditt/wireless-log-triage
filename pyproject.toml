[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-log-triage"
version = "0.1.0"
description = "Synthetic wireless test-log clustering, anomaly detection, and grounded triage"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wireless-triage = "wireless_log_triage.cli:main"

[tool.setuptools.packages.find]
include = ["wireless_log_triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
